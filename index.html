<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 移动端视口必须保留，禁止缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>猜数字游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            /* 移动端弹性布局，全部内容居中 */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
            gap: 24px; /* 元素间距 */
            font-family: system-ui, sans-serif;
        }
        h1 {
            font-size: 22px;
            text-align: center;
        }
        #guess {
            width: min(280px, 90vw);
            height: 70px;
            font-size: 22px;
            padding: 10px;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 8px;
        }
        .btn-wrap {
            display: flex;
            gap: 16px;
        }
        button {
            width: 110px;
            height: 70px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background-color: #2563eb;
            color: white;
            cursor: pointer;
        }
        button#reset {
            background-color: #6b7280;
        }
        button:disabled {
            background-color: #bbbbbb;
            cursor: not-allowed;
        }
        #count {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>猜猜数字是多少，范围1-100，你有8次机会</h1>
    <input type="number" id="guess" min="1" max="100" placeholder="输入1~100数字">
    <div class="btn-wrap">
        <button id="submitBtn" onclick="submition()">提交</button>
        <button id="reset" onclick="resetGame()">重置</button>
    </div>
    <div id="count">8次机会</div>

    <script>
        // let 可以重新赋值，不能用const
        let answer = Math.floor(Math.random() * 100) + 1;
        const inputEle = document.getElementById("guess");
        const submitBtn = document.getElementById("submitBtn");
        const countEle = document.getElementById("count");
        let remainTimes = 8; // 剩余次数

        // 重置游戏（改名，避开location冲突）
        function resetGame() {
            answer = Math.floor(Math.random() * 100) + 1;
            remainTimes = 8;
            countEle.innerText = `${remainTimes}次机会`;
            inputEle.value = "";
            submitBtn.disabled = false; // 恢复按钮
        }

        function submition() {
            // 转为数字
            let num = Number(inputEle.value);

            // 校验：空、非数字、超出范围
            if (isNaN(num) || num < 1 || num > 100) {
                alert("输入错误，请输入1~100之间整数！");
                return;
            }

            remainTimes--;

            if (num === answer) {
                alert("猜对了！");
                resetGame(); // 猜对直接开启新一局
                return;
            } else if (num > answer) {
                alert("猜大了");
            } else {
                alert("猜小了");
            }

            countEle.innerText = `${remainTimes}次机会`;

            // 机会用尽，禁止提交
            if (remainTimes <= 0) {
                alert(`机会用完啦！正确数字是${answer}`);
                submitBtn.disabled = true;
            }
        }
    </script>
</body>
</html>
